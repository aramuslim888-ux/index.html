<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurdish GTA SA Style - By Aro Bestoon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050505; color: #fff; }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e1b4b); z-index: 10; padding: 20px;
        }
        .hidden { display: none !important; }
        h1 { font-size: 2.5rem; margin-bottom: 15px; color: #f1c40f; text-align: center; text-shadow: 2px 2px 10px rgba(0,0,0,0.9); font-weight: 900; }
        .author-text {
            font-size: 1.2rem; margin-bottom: 30px; color: #00e1D9; background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00e1D9; padding: 8px 30px; border-radius: 40px; box-shadow: 0 0 15px rgba(0, 225, 217, 0.4); font-weight: bold;
        }
        .btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; border: 2px solid #fff;
            padding: 15px 45px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer;
            margin: 10px; transition: 0.3s; box-shadow: 0 5px 20px rgba(231, 76, 60, 0.5); width: 280px; text-align: center;
        }
        .btn:hover { transform: scale(1.05); }
        #game-container { width: 100%; height: 100%; position: relative; }
        canvas { display: block; width: 100%; height: 100%; }
        
        .controls-left { position: absolute; bottom: 25px; left: 25px; display: flex; gap: 15px; z-index: 5; }
        .controls-right { position: absolute; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 12px; z-index: 5; }
        .ctrl-btn {
            width: 70px; height: 70px; background: rgba(0, 0, 0, 0.65); border: 3px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%; font-size: 1.8rem; color: white; display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }
        .ctrl-btn:active { background: rgba(241, 196, 15, 0.85); transform: scale(0.92); }
        
        #action-btn {
            position: absolute; bottom: 110px; right: 35px; width: 85px; height: 85px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8); border: 3px solid #fff; border-radius: 50%;
            font-size: 1rem; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 5; box-shadow: 0 5px 20px rgba(37, 99, 235, 0.6);
        }
        #hud {
            position: absolute; top: 20px; right: 20px; font-size: 1.2rem; font-weight: bold;
            background: rgba(0, 0, 0, 0.8); border: 2px solid #f1c40f; padding: 10px 20px;
            border-radius: 10px; z-index: 5; color: #f1c40f; direction: ltr;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://ia801502.us.archive.org/15/items/KurdishMusic/HassanZirak.mp3" type="audio/mp3">
    </audio>

    <div id="main-menu" class="screen">
        <h1>یاری جیهانی کوردی (GTA SA Style)</h1>
        <div class="author-text">دروست کراوە لە لایەن ئارۆ بێستون</div>
        <button class="btn" onclick="startGame()">دەستپێک / Start Game</button>
    </div>

    <div id="game-container" class="hidden">
        <div id="hud">Mode: <span id="mode-text">Driving</span> | Speed: <span id="speed">0</span> km/h</div>
        
        <div id="action-btn" onclick="toggleEnterExit()">سوار/دابەزین</div>

        <div class="controls-left">
            <div class="ctrl-btn" ontouchstart="setMove(-1, 0)" ontouchend="setMove(0, 0)" onmousedown="setMove(-1, 0)" onmouseup="setMove(0, 0)">⬅️</div>
            <div class="ctrl-btn" ontouchstart="setMove(1, 0)" ontouchend="setMove(0, 0)" onmousedown="setMove(1, 0)" onmouseup="setMove(0, 0)">➡️</div>
        </div>

        <div class="controls-right">
            <div class="ctrl-btn" ontouchstart="setMove(0, 1)" ontouchend="setMove(0, 0)" onmousedown="setMove(0, 1)" onmouseup="setMove(0, 0)">⬆️</div>
            <div class="ctrl-btn" ontouchstart="setMove(0, -1)" ontouchend="setMove(0, 0)" onmousedown="setMove(0, -1)" onmouseup="setMove(0, 0)">⬇️</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let music = document.getElementById('bg-music');
        let scene, camera, renderer;
        let carGroup, playerGroup;
        let isDriving = true;
        let moveX = 0, moveY = 0, carSpeed = 0;
        let isPlaying = false;

        function startGame() {
            music.play().catch(e => {});
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            initWorld();
            isPlaying = true;
            animate();
        }

        function setMove(x, y) { moveX = x; moveY = y; }

        function initWorld() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            let dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(40, 80, 40);
            scene.add(dirLight);

            // Ground & Road
            let ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0x111827 }));
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            let road = new THREE.Mesh(new THREE.PlaneGeometry(18, 4000), new THREE.MeshStandardMaterial({ color: 0x1f2937 }));
            road.rotation.x = -Math.PI / 2;
            road.position.y = 0.02;
            scene.add(road);

            // Glass Towers (GTA Style buildings)
            let glassMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.9 });
            for(let i = -180; i <= 180; i += 30) {
                if (Math.abs(i) < 25) continue;
                let h1 = Math.random() * 70 + 40;
                let b1 = new THREE.Mesh(new THREE.BoxGeometry(18, h1, 18), glassMat);
                b1.position.set(i, h1/2, -60);
                scene.add(b1);
                let b2 = new THREE.Mesh(new THREE.BoxGeometry(18, h1, 18), glassMat);
                b2.position.set(i, h1/2, 60);
                scene.add(b2);
            }

            // Create Car
            carGroup = new THREE.Group();
            let body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.6), new THREE.MeshStandardMaterial({ color: 0xdc2626, metalness: 0.8 }));
            body.position.y = 0.6;
            carGroup.add(body);
            let cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.3), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            cabin.position.set(0, 1.2, -0.2);
            carGroup.add(cabin);
            carGroup.position.set(0, 0, 0);
            scene.add(carGroup);

            // Create Player (CJ Style)
            playerGroup = new THREE.Group();
            let pBody = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.5), new THREE.MeshStandardMaterial({ color: 0x16a34a }));
            pBody.position.y = 0.8;
            playerGroup.add(pBody);
            playerGroup.position.set(3, 0, 2);
            playerGroup.visible = false;
            scene.add(playerGroup);
        }

        function toggleEnterExit() {
            if (isDriving) {
                // Get out of car
                isDriving = false;
                playerGroup.position.set(carGroup.position.x + 2, 0, carGroup.position.z);
                playerGroup.rotation.y = carGroup.rotation.y;
                playerGroup.visible = true;
                document.getElementById('mode-text').innerText = "On Foot (پیاده)";
            } else {
                // Get into car if close
                let dist = playerGroup.position.distanceTo(carGroup.position);
                if (dist < 5) {
                    isDriving = true;
                    playerGroup.visible = false;
                    document.getElementById('mode-text').innerText = "Driving (سەیارە)";
                } else {
                    alert("سەیارەکە دوورە لێتەوە!");
                }
            }
        }

        function animate() {
            if (!isPlaying) return;
            requestAnimationFrame(animate);

            if (isDriving) {
                carSpeed += moveY * 0.14;
                carSpeed *= 0.95;
                if (carSpeed > 1.8) carSpeed = 1.8;
                if (carSpeed < -0.6) carSpeed = -0.6;

                if (moveX !== 0 && Math.abs(carSpeed) > 0.05) {
                    carGroup.rotation.y += moveX * 0.04 * (carSpeed > 0 ? 1 : -1);
                }

                let angle = carGroup.rotation.y;
                carGroup.position.x += Math.sin(angle) * carSpeed;
                carGroup.position.z += Math.cos(angle) * carSpeed;

                // Camera follow car
                let targetX = carGroup.position.x - Math.sin(angle) * 10;
                let targetZ = carGroup.position.z - Math.cos(angle) * 10;
                camera.position.x += (targetX - camera.position.x) * 0.15;
                camera.position.y = carGroup.position.y + 4.5;
                camera.position.z += (targetZ - camera.position.z) * 0.15;
                camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z);

                document.getElementById('speed').innerText = Math.round(Math.abs(carSpeed) * 65);
            } else {
                // On foot movement
                let walkSpeed = 0.1;
                if (moveY !== 0) {
                    playerGroup.position.x += Math.sin(playerGroup.rotation.y) * moveY * walkSpeed;
                    playerGroup.position.z += Math.cos(playerGroup.rotation.y) * moveY * walkSpeed;
                }
                if (moveX !== 0) {
                    playerGroup.rotation.y -= moveX * 0.05;
                }

                // Camera follow player
                let pX = playerGroup.position.x - Math.sin(playerGroup.rotation.y) * 6;
                let pZ = playerGroup.position.z - Math.cos(playerGroup.rotation.y) * 6;
                camera.position.x += (pX - camera.position.x) * 0.15;
                camera.position.y = playerGroup.position.y + 3;
                camera.position.z += (pZ - camera.position.z) * 0.15;
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

                document.getElementById('speed').innerText = "0";
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
